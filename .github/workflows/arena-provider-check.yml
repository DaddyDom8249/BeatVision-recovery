name: BeatVision Arena Provider Check

on:
  push:
    branches: [main, audit-stabilization, arena-integration]
    paths:
      - "cloudflare-worker/**"
      - "frontend/src/lib/persistentAnimation.js"
      - "frontend/src/components/PersistentAnimationPanel.jsx"
      - ".github/workflows/arena-provider-check.yml"
  pull_request:
    paths:
      - "cloudflare-worker/**"
      - "frontend/src/lib/persistentAnimation.js"
      - "frontend/src/components/PersistentAnimationPanel.jsx"
      - ".github/workflows/arena-provider-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Worker JSON configuration
        run: node -e "JSON.parse(require('fs').readFileSync('cloudflare-worker/wrangler.jsonc','utf8')); console.log('wrangler config: PASS')"
      - name: Compile Worker with Wrangler
        working-directory: cloudflare-worker
        run: npx --yes wrangler@latest deploy --dry-run --outdir=/tmp/beatvision-worker
      - name: Verify persistent animation contract is present
        run: |
          grep -q "BeatVisionAnimationJob" cloudflare-worker/src/animation-jobs.ts
          grep -q "ANIMATION_JOBS" cloudflare-worker/wrangler.jsonc
          grep -q "/v1/video/animate/jobs/" cloudflare-worker/src/video-fallback-gateway.ts
          grep -q "/v1/video/assemble" cloudflare-worker/src/shotstack-gateway.ts
          grep -q "pixazo" cloudflare-worker/src/pixazo-media-gateway-fixed.ts
          grep -q "pollinations" cloudflare-worker/src/pollinations-gateway-v2.ts
          echo "Arena provider contract checks: PASS"
