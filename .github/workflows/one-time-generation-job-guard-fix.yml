name: One-time generation job guard fix
on:
  push:
    branches: [audit-stabilization]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix generation loading guards'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix guards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/pages/ProjectWorkflow.jsx')
          s=p.read_text()
          replacements={
            'const kind = "world-report";\n  if (projectRef.current?.generationJobs?.[kind]?.status === "running") return;':'const kind = "world-report";\n    if (loading.world) return;',
            'const kind = "world-assets";\n  if (projectRef.current?.generationJobs?.[kind]?.status === "running") return;':'const kind = "world-assets";\n    if (loading.assets) return;',
            'const kind = "storyboard";\n  if (projectRef.current?.generationJobs?.[kind]?.status === "running") return;':'const kind = "storyboard";\n    if (loading.story) return;',
            'const kind = "scene-prompts";\n  if (projectRef.current?.generationJobs?.[kind]?.status === "running") return;':'const kind = "scene-prompts";\n    if (loading.prompts) return;',
            'const kind = `scene-image:${sceneNumber}`;\n  if (projectRef.current?.generationJobs?.[kind]?.status === "running") return;':'const kind = `scene-image:${sceneNumber}`;\n    if (loading[`img-${sceneNumber}`]) return;',
          }
          for old,new in replacements.items():
              assert old in s, old
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/ProjectWorkflow.jsx
          git commit -m 'Fix generation loading guards'
          git push
