name: Repair generation retry timestamp reset
on:
  push:
    branches:
      - audit-stabilization
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-stabilization
      - name: Patch storage retry lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/lib/storage.js')
          text = path.read_text(encoding='utf-8')
          old = '''    return {
      generationJobs: {
        ...(project.generationJobs || {}),
        [kind]: normalizeJob({
          ...(previous || {}),
          id: isNewAttempt
            ? `${kind}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`
            : previous?.id || `${kind}-${Date.now()}`,
          kind,
          ...patch,
          attempt,
          queuedAt: isNewAttempt
            ? patch.queuedAt || now
            : previous?.queuedAt || patch.queuedAt || now,
          startedAt:
            patch.status === "running"
              ? patch.startedAt || previous?.startedAt || now
              : isNewAttempt
                ? patch.startedAt || null
                : patch.startedAt || previous?.startedAt || null,
        }),
      },
    };'''
          new = '''    return {
      generationJobs: {
        ...(project.generationJobs || {}),
        [kind]: normalizeJob({
          ...(previous || {}),
          id: isNewAttempt
            ? `${kind}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`
            : previous?.id || `${kind}-${Date.now()}`,
          kind,
          ...patch,
          attempt,
          queuedAt: isNewAttempt
            ? patch.queuedAt || now
            : previous?.queuedAt || patch.queuedAt || now,
          startedAt:
            patch.status === "running"
              ? patch.startedAt || previous?.startedAt || now
              : isNewAttempt
                ? patch.startedAt || null
                : patch.startedAt || previous?.startedAt || null,
          finishedAt: isNewAttempt
            ? patch.finishedAt || null
            : patch.finishedAt || previous?.finishedAt || null,
          error: isNewAttempt
            ? patch.error || null
            : patch.error || previous?.error || null,
        }),
      },
    };'''
          if old not in text:
              raise SystemExit('expected storage block not found')
          if 'finishedAt: isNewAttempt' in text:
              raise SystemExit('storage retry lifecycle already repaired')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/storage.js
          git commit -m "Fix generation retry timestamp reset"
          git push origin audit-stabilization
