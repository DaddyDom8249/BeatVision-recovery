name: Temporary storage quota repair
on:
  push:
    branches: [audit-stabilization]
permissions:
  contents: write
jobs:
  repair:
    if: contains(github.event.head_commit.message, 'Add temporary storage quota repair workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch generation persistence lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/pages/ProjectWorkflow.jsx')
          text = path.read_text()
          text = text.replace(
              'getProject, upsertProject, setGenerationJob, fileToDataUrl, StorageQuotaError',
              'getProject, upsertProject, setGenerationJob, fileToDataUrl, StorageQuotaError, isStorageQuotaError'
          )
          marker = '  function isCurrentGenerationAttempt(kind, jobId) {'
          helper = '''  function generationStorageError(error, phase) {
    if (isStorageQuotaError(error)) {
      const message = phase === "start"
        ? "Browser storage is full. Remove large reference or scene images before starting another generation."
        : "Browser storage is full. The generated result may be saved, but its generation status could not be updated.";
      toast.error(message);
      return true;
    }
    return false;
  }

  function beginGenerationJob(kind, loadKey) {
    setLoad(loadKey, true);
    try {
      const queuedJob = setGenerationJob(project.id, kind, {
        status: "queued",
        error: null,
        finishedAt: null,
      });
      const jobId = queuedJob?.generationJobs?.[kind]?.id || null;
      if (!jobId) {
        throw new Error("Generation job could not be created.");
      }
      setGenerationJob(project.id, kind, {
        status: "running",
        error: null,
        finishedAt: null,
      });
      return jobId;
    } catch (error) {
      console.error("Generation job start failed", error);
      if (!generationStorageError(error, "start")) {
        toast.error(error?.message || "Generation could not be started.");
      }
      setLoad(loadKey, false);
      return null;
    }
  }

  function finishGenerationJob(kind, jobId) {
    try {
      if (isCurrentGenerationAttempt(kind, jobId)) {
        setGenerationJob(project.id, kind, {
          status: "succeeded",
          error: null,
          finishedAt: new Date().toISOString(),
        });
      }
    } catch (error) {
      console.error("Generation success status persistence failed", error);
      if (!generationStorageError(error, "finish")) {
        toast.error("Generation completed, but its status could not be saved.");
      }
    }
  }

  function failGenerationJob(kind, jobId, error) {
    try {
      if (isCurrentGenerationAttempt(kind, jobId)) {
        setGenerationJob(project.id, kind, {
          status: "failed",
          error,
          finishedAt: new Date().toISOString(),
        });
      }
    } catch (persistError) {
      console.error("Generation failure status persistence failed", persistError);
      if (!generationStorageError(persistError, "finish")) {
        toast.error("Generation failed, and its failure status could not be saved.");
      }
    }
  }

'''
          if helper not in text:
              text = text.replace(marker, helper + marker)

          replacements = {
'''  const queuedJob = setGenerationJob(project.id, kind, { status: "queued", error: null, finishedAt: null });
  const jobId = queuedJob?.generationJobs?.[kind]?.id || null;
  setGenerationJob(project.id, kind, { status: "running", error: null, finishedAt: null });
  setLoad("world", true);''': '''  const jobId = beginGenerationJob(kind, "world");
    if (!jobId) return;''',
'''  const queuedJob = setGenerationJob(project.id, kind, { status: "queued", error: null, finishedAt: null });
  const jobId = queuedJob?.generationJobs?.[kind]?.id || null;
  setGenerationJob(project.id, kind, { status: "running", error: null, finishedAt: null });
  setLoad("assets", true);''': '''  const jobId = beginGenerationJob(kind, "assets");
    if (!jobId) return;''',
'''  const queuedJob = setGenerationJob(project.id, kind, { status: "queued", error: null, finishedAt: null });
  const jobId = queuedJob?.generationJobs?.[kind]?.id || null;
  setGenerationJob(project.id, kind, { status: "running", error: null, finishedAt: null });
  setLoad("story", true);''': '''  const jobId = beginGenerationJob(kind, "story");
    if (!jobId) return;''',
'''  const queuedJob = setGenerationJob(project.id, kind, { status: "queued", error: null, finishedAt: null });
  const jobId = queuedJob?.generationJobs?.[kind]?.id || null;
  setGenerationJob(project.id, kind, { status: "running", error: null, finishedAt: null });
  setLoad("prompts", true);''': '''  const jobId = beginGenerationJob(kind, "prompts");
    if (!jobId) return;''',
'''  const queuedJob = setGenerationJob(project.id, kind, { status: "queued", error: null, finishedAt: null });
  const jobId = queuedJob?.generationJobs?.[kind]?.id || null;
  setGenerationJob(project.id, kind, { status: "running", error: null, finishedAt: null });
  setLoad(`img-${sceneNumber}`, true);''': '''  const jobId = beginGenerationJob(kind, `img-${sceneNumber}`);
    if (!jobId) return;''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected generation start block: {old[:80]}')
              text = text.replace(old, new, 1)

          import re
          text = re.sub(
              r'setGenerationJob\(project\.id, kind, \{ status: "succeeded", error: null, finishedAt: new Date\(\)\.toISOString\(\) \}\);',
              'finishGenerationJob(kind, jobId);',
              text
          )
          text = re.sub(
              r'setGenerationJob\(project\.id, kind, \{ status: "failed", error, finishedAt: new Date\(\)\.toISOString\(\) \}\);',
              'failGenerationJob(kind, jobId, error);',
              text
          )
          path.write_text(text)
          PY
      - name: Validate patch
        run: |
          node --check <(sed -n '/<script>/,/\\<\\/script>/p' /dev/null) 2>/dev/null || true
          grep -q 'function beginGenerationJob' frontend/src/pages/ProjectWorkflow.jsx
          grep -q 'function finishGenerationJob' frontend/src/pages/ProjectWorkflow.jsx
          grep -q 'function failGenerationJob' frontend/src/pages/ProjectWorkflow.jsx
          grep -q 'isStorageQuotaError' frontend/src/pages/ProjectWorkflow.jsx
      - name: Commit repair and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/ProjectWorkflow.jsx .github/workflows/_tmp_storage_quota_repair.yml
          git commit -m 'Handle storage quota during generation jobs'
          git push
