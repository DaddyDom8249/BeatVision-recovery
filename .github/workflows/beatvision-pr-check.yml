name: BeatVision PR Check

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - "cloudflare-worker/**"
      - "scripts/start-worker-backed-local.sh"
      - ".github/workflows/beatvision-pr-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - "cloudflare-worker/**"
      - "scripts/start-worker-backed-local.sh"
      - ".github/workflows/beatvision-pr-check.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beatvision-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Worker, backend, and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Cloudflare Worker source
        run: |
          node --check cloudflare-worker/src/index.js

          python - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path("cloudflare-worker/package.json"),
              Path("cloudflare-worker/wrangler.jsonc"),
          ):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"PASS: {path}")
          PY

      - name: Validate backend and startup syntax
        run: |
          python -m py_compile backend/server.py
          python -m py_compile backend/fallbacks.py
          python -m py_compile backend/worker_proxy_server.py
          bash -n scripts/start-worker-backed-local.sh

      - name: Smoke-test local Worker proxy
        run: |
          set -Eeuo pipefail

          TMP_DIR="$(mktemp -d)"
          MOCK_PID=""
          PROXY_PID=""

          cleanup() {
            [ -z "$PROXY_PID" ] || kill "$PROXY_PID" 2>/dev/null || true
            [ -z "$MOCK_PID" ] || kill "$MOCK_PID" 2>/dev/null || true
            rm -rf "$TMP_DIR"
          }

          trap cleanup EXIT

          cat > "$TMP_DIR/mock_worker.py" <<'PY'
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import json


          class Handler(BaseHTTPRequestHandler):
              def log_message(self, *_args):
                  return

              def send_json(self, status, payload):
                  body = json.dumps(payload).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def authorized(self):
                  return self.headers.get("X-BeatVision-Key") == "ci-test-key"

              def do_GET(self):
                  if not self.authorized():
                      self.send_json(403, {"detail": "bad key"})
                      return

                  self.send_json(
                      200,
                      {
                          "status": "ok",
                          "aiBindingConfigured": True,
                          "accessKeyConfigured": True,
                      },
                  )

              def do_POST(self):
                  if not self.authorized():
                      self.send_json(403, {"detail": "bad key"})
                      return

                  length = int(self.headers.get("Content-Length", "0"))
                  raw = self.rfile.read(length)
                  payload = json.loads(raw.decode("utf-8"))

                  self.send_json(
                      200,
                      {
                          "authenticated": True,
                          "receivedScenePrompt": payload.get("scenePrompt"),
                      },
                  )


          ThreadingHTTPServer(("127.0.0.1", 18080), Handler).serve_forever()
          PY

          python "$TMP_DIR/mock_worker.py" > "$TMP_DIR/mock.log" 2>&1 &
          MOCK_PID=$!

          BEATVISION_WORKER_URL="http://127.0.0.1:18080" \
          BEATVISION_WORKER_KEY="ci-test-key" \
          python backend/worker_proxy_server.py > "$TMP_DIR/proxy.log" 2>&1 &
          PROXY_PID=$!

          for _ in $(seq 1 40); do
            if curl -fsS \
              -H "Origin: http://127.0.0.1:3000" \
              http://127.0.0.1:8001/api/health > "$TMP_DIR/health.json"
            then
              break
            fi
            sleep 0.25
          done

          HEALTH="$(cat "$TMP_DIR/health.json")"
          python - "$HEALTH" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          assert payload["status"] == "ok"
          assert payload["aiBindingConfigured"] is True
          assert payload["accessKeyConfigured"] is True
          PY

          HEADERS="$(curl -sS -D - -o /dev/null \
            -H "Origin: http://127.0.0.1:3000" \
            http://127.0.0.1:8001/api/health)"

          printf '%s\n' "$HEADERS" | tr -d '\r' | grep -qi \
            '^Access-Control-Allow-Origin: http://127.0.0.1:3000$'

          FOREIGN_CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Origin: https://example.invalid" \
            http://127.0.0.1:8001/api/health)"
          [ "$FOREIGN_CODE" = "403" ]

          GENERATED="$(curl -fsS \
            -H "Origin: http://127.0.0.1:3000" \
            -H "Content-Type: application/json" \
            -d '{"scenePrompt":"CI proxy test"}' \
            http://127.0.0.1:8001/api/generate-scene-image)"

          python - "$GENERATED" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          assert payload["authenticated"] is True
          assert payload["receivedScenePrompt"] == "CI proxy test"
          PY

          echo "Proxy runtime smoke test: PASS"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run frontend persistence regressions
        working-directory: frontend
        env:
          CI: "true"
        run: npm test -- --watchAll=false --runInBand

      - name: Build BeatVision frontend
        working-directory: frontend
        env:
          CI: "true"
          GENERATE_SOURCEMAP: "false"
          REACT_APP_BACKEND_URL: "http://127.0.0.1:8000"
          REACT_APP_IMAGE_TEST_URL: "http://127.0.0.1:8001"
        run: npm run build

      - name: Repair audit-stabilization persistence
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[repair-runner]') }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin audit-stabilization main
          git checkout -B repair-audit origin/audit-stabilization

          python3 - <<'PY'
          from pathlib import Path

          Path('frontend/src/lib/sceneImageStorage.js').write_text(r'''const DB_NAME = "beatvision.scene-images.v1";
const STORE_NAME = "projects";

function canUseIndexedDb() {
  return typeof indexedDB !== "undefined";
}

function openDatabase() {
  if (!canUseIndexedDb()) return Promise.resolve(null);
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: "projectId" });
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error("Unable to open scene image storage."));
  });
}

export async function loadSceneImages(projectId) {
  const db = await openDatabase();
  if (!db) return null;
  try {
    return await new Promise((resolve, reject) => {
      const request = db.transaction(STORE_NAME, "readonly").objectStore(STORE_NAME).get(projectId);
      request.onsuccess = () => resolve(request.result?.sceneImages || null);
      request.onerror = () => reject(request.error || new Error("Unable to load scene images."));
    });
  } finally {
    db.close();
  }
}

export async function saveSceneImages(projectId, sceneImages) {
  const db = await openDatabase();
  if (!db) return false;
  try {
    await new Promise((resolve, reject) => {
      const request = db.transaction(STORE_NAME, "readwrite").objectStore(STORE_NAME).put({
        projectId,
        sceneImages: sceneImages || {},
      });
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error || new Error("Unable to save scene images."));
    });
    return true;
  } finally {
    db.close();
  }
}
''')

          workflow = Path('frontend/src/pages/ProjectWorkflow.jsx')
          text = workflow.read_text()

          old = 'import { getProject, upsertProject, setGenerationJob, fileToDataUrl, StorageQuotaError } from "@/lib/storage";'
          new = old + '\nimport { loadSceneImages, saveSceneImages } from "@/lib/sceneImageStorage";'
          if old not in text: raise SystemExit('ProjectWorkflow import anchor not found')
          text = text.replace(old, new, 1)

          old = '''  useEffect(() => {\n    const p = getProject(id);\n    if (!p) {\n      toast.error("Project not found");\n      nav("/dashboard");\n      return;\n    }\n    projectRef.current = p;\n    setProject(p);\n    fetchProviderStatus()\n      .then(setProviderStatus)\n      .catch(() => setProviderStatus(null));\n  }, [id, nav]);'''
          new = '''  useEffect(() => {\n    let cancelled = false;\n    const p = getProject(id);\n    if (!p) {\n      toast.error("Project not found");\n      nav("/dashboard");\n      return undefined;\n    }\n    projectRef.current = p;\n    setProject(p);\n\n    (async () => {\n      try {\n        const storedSceneImages = await loadSceneImages(id);\n        if (cancelled) return;\n        const localSceneImages = p.sceneImages || {};\n        const hasInlineImages = Object.values(localSceneImages).some(\n          (entry) => typeof entry?.imageDataUrl === "string" && entry.imageDataUrl\n        );\n        if (storedSceneImages && Object.keys(storedSceneImages).length > 0) {\n          const hydrated = { ...p, sceneImages: storedSceneImages };\n          projectRef.current = hydrated;\n          setProject(hydrated);\n        } else if (hasInlineImages) {\n          const savedToIndexedDb = await saveSceneImages(id, localSceneImages);\n          if (cancelled) return;\n          const migrated = upsertProject({\n            ...p,\n            sceneImages: savedToIndexedDb ? sceneImageManifest(localSceneImages) : localSceneImages,\n          });\n          const hydrated = { ...migrated, sceneImages: localSceneImages };\n          projectRef.current = hydrated;\n          setProject(hydrated);\n        }\n      } catch (error) {\n        console.error("Scene image hydration failed", error);\n      }\n    })();\n\n    fetchProviderStatus()\n      .then((status) => { if (!cancelled) setProviderStatus(status); })\n      .catch(() => { if (!cancelled) setProviderStatus(null); });\n\n    return () => { cancelled = true; };\n  }, [id, nav]);'''
          if old not in text: raise SystemExit('ProjectWorkflow effect anchor not found')
          text = text.replace(old, new, 1)

          old = '''  function persist(patch) {\n    const current = projectRef.current || project;\n    if (!current) return;\n\n    const next = { ...current, ...patch };\n\n    projectRef.current = next;\n    setProject(next);\n\n    try {\n      upsertProject(next);\n    } catch (error) {'''
          new = '''  function sceneImageManifest(sceneImages) {\n    return Object.fromEntries(\n      Object.entries(sceneImages || {}).map(([key, entry]) => {\n        if (!entry || typeof entry !== "object") return [key, entry];\n        const { imageDataUrl, ...metadata } = entry;\n        return [key, { ...metadata, hasImageData: Boolean(imageDataUrl) }];\n      })\n    );\n  }\n\n  async function persist(patch) {\n    const current = projectRef.current || project;\n    if (!current) return false;\n\n    const hasSceneImages = Object.prototype.hasOwnProperty.call(patch, "sceneImages");\n    let persistedPatch = patch;\n\n    try {\n      if (hasSceneImages) {\n        const savedToIndexedDb = await saveSceneImages(current.id, patch.sceneImages || {});\n        persistedPatch = savedToIndexedDb\n          ? { ...patch, sceneImages: sceneImageManifest(patch.sceneImages) }\n          : patch;\n      }\n\n      const saved = upsertProject({ ...current, ...persistedPatch });\n      const visible = hasSceneImages\n        ? { ...saved, sceneImages: patch.sceneImages || {} }\n        : saved;\n      projectRef.current = visible;\n      setProject(visible);\n      return true;\n    } catch (error) {'''
          if old not in text: raise SystemExit('ProjectWorkflow persist anchor not found')
          text = text.replace(old, new, 1)

          old = '''      } else {\n        toast.error(\n          "The latest project change could not be saved to browser storage."\n        );\n      }\n    }\n  }'''
          new = '''      } else {\n        toast.error(\n          "The latest project change could not be saved to browser storage."\n        );\n      }\n      return false;\n    }\n  }'''
          if old not in text: raise SystemExit('ProjectWorkflow persist tail anchor not found')
          text = text.replace(old, new, 1)
          workflow.write_text(text)

          storage = Path('frontend/src/lib/storage.js')
          s = storage.read_text()
          marker = 'export function normalizeProject(project) {'
          helper = '''function sceneImageManifest(sceneImages) {\n  return Object.fromEntries(\n    Object.entries(sceneImages || {}).map(([key, entry]) => {\n      if (!entry || typeof entry !== "object") return [key, entry];\n      const { imageDataUrl, ...metadata } = entry;\n      return [key, { ...metadata, hasImageData: Boolean(imageDataUrl) }];\n    })\n  );\n}\n\n'''
          if marker not in s: raise SystemExit('storage marker not found')
          if helper not in s: s = s.replace(marker, helper + marker, 1)
          old = '''  const normalized = Array.isArray(projects)\n    ? projects.map(normalizeProject).filter(Boolean)\n    : [];'''
          new = '''  const normalized = Array.isArray(projects)\n    ? projects.map(normalizeProject).filter(Boolean)\n    : [];\n  const persisted = normalized.map((project) => ({\n    ...project,\n    sceneImages: sceneImageManifest(project.sceneImages),\n  }));'''
          if old not in s: raise SystemExit('storage saveProjects anchor not found')
          s = s.replace(old, new, 1)
          old_json = 'JSON.stringify({ version: STORE_VERSION, projects: normalized })'
          if old_json not in s: raise SystemExit('storage JSON anchor not found')
          s = s.replace(old_json, 'JSON.stringify({ version: STORE_VERSION, projects: persisted })', 1)
          storage.write_text(s)

          temp = Path('.github/workflows/repair-persistence.yml')
          if temp.exists(): temp.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/storage.js frontend/src/lib/sceneImageStorage.js frontend/src/pages/ProjectWorkflow.jsx .github/workflows/repair-persistence.yml
          git commit -m "Persist scene images outside localStorage [repair]"
          git push origin HEAD:audit-stabilization

          git fetch origin main
          git checkout -B cleanup-main origin/main
          git checkout HEAD^ -- .github/workflows/beatvision-pr-check.yml
          git rm -f .github/workflows/repair-persistence.yml 2>/dev/null || true
          git add .github/workflows/beatvision-pr-check.yml .github/workflows/repair-persistence.yml
          git commit -m "Remove temporary persistence repair runner"
          git push origin HEAD:main
